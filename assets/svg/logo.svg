<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:1" />
      <stop offset="35%" style="stop-color:#f4a300;stop-opacity:1" />
      <stop offset="65%" style="stop-color:#e63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c1121f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700" />
      <stop offset="50%" style="stop-color:#fff8a0" />
      <stop offset="100%" style="stop-color:#b8860b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo del logo -->
  <rect x="4" y="4" width="412" height="152" rx="18" ry="18" fill="url(#bgGrad)" />
  <!-- Borde dorado exterior -->
  <rect x="2" y="2" width="416" height="156" rx="20" ry="20" fill="none" stroke="url(#borderGrad)" stroke-width="4"/>
  <!-- Borde negro interior -->
  <rect x="8" y="8" width="404" height="144" rx="14" ry="14" fill="none" stroke="#111" stroke-width="2.5"/>

  <!-- Estrellas decorativas -->
  <text x="18" y="42" font-size="22" fill="#ffd700" opacity="0.85">★</text>
  <text x="385" y="42" font-size="22" fill="#ffd700" opacity="0.85">★</text>
  <text x="18" y="130" font-size="18" fill="#ffd700" opacity="0.7">✦</text>
  <text x="388" y="130" font-size="18" fill="#ffd700" opacity="0.7">✦</text>

  <!-- Texto COMIDAS RAPIDAS -->
  <text
    x="210" y="72"
    text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="34"
    font-weight="900"
    letter-spacing="3"
    fill="white"
    stroke="#111"
    stroke-width="2.5"
    paint-order="stroke"
    filter="url(#shadow)"
  >COMIDAS RAPIDAS</text>

  <!-- Separador decorativo -->
  <line x1="60" y1="86" x2="360" y2="86" stroke="#ffd700" stroke-width="1.5" opacity="0.7"/>
  <circle cx="210" cy="86" r="4" fill="#ffd700"/>
  <circle cx="180" cy="86" r="2.5" fill="#ffd700" opacity="0.6"/>
  <circle cx="240" cy="86" r="2.5" fill="#ffd700" opacity="0.6"/>

  <!-- Texto MUNDO TUNES -->
  <text
    x="210" y="128"
    text-anchor="middle"
    font-family="'Georgia', 'Times New Roman', serif"
    font-size="38"
    font-weight="900"
    letter-spacing="5"
    fill="#ffd700"
    stroke="#111"
    stroke-width="2.5"
    paint-order="stroke"
    filter="url(#shadow)"
  >MUNDO TUNES</text>
</svg>
