<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="220" height="100">
  <defs>
    <filter id="cloud-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,80,0.18)"/>
    </filter>
    <clipPath id="cloud-clip">
      <rect x="0" y="0" width="220" height="100"/>
    </clipPath>
  </defs>
  <g filter="url(#cloud-shadow)" clip-path="url(#cloud-clip)">
    <!-- base ancha y alta para cubrir fondos de burbujas sin rect visible -->
    <ellipse cx="110" cy="88" rx="100" ry="30" fill="white"/>
    <!-- burbuja izq -->
    <ellipse cx="45"  cy="58" rx="34" ry="34" fill="white"/>
    <!-- burbuja centro-izq -->
    <ellipse cx="83"  cy="44" rx="38" ry="38" fill="white"/>
    <!-- burbuja centro -->
    <ellipse cx="124" cy="38" rx="42" ry="40" fill="white"/>
    <!-- burbuja der -->
    <ellipse cx="168" cy="54" rx="34" ry="32" fill="white"/>
  </g>
</svg>
