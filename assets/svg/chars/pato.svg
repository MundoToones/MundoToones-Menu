<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Pato negro gruñón estilo cartoon (original) -->
  <!-- Cuerpo -->
  <ellipse cx="60" cy="118" rx="28" ry="32" fill="#1a1a2e" stroke="#222" stroke-width="2.5"/>
  <!-- Panza blanca -->
  <ellipse cx="60" cy="122" rx="16" ry="22" fill="#f0f0f0"/>
  <!-- Cuello -->
  <rect x="50" y="85" width="20" height="20" rx="8" fill="#1a1a2e" stroke="#222" stroke-width="2"/>
  <!-- Cabeza -->
  <ellipse cx="60" cy="72" rx="26" ry="24" fill="#1a1a2e" stroke="#222" stroke-width="2.5"/>
  <!-- Cachetes blancos del pato -->
  <ellipse cx="60" cy="76" rx="18" ry="14" fill="#f0f0f0"/>
  <!-- Ojos molestos / enojados -->
  <ellipse cx="48" cy="63" rx="8" ry="8" fill="white" stroke="#222" stroke-width="2"/>
  <ellipse cx="72" cy="63" rx="8" ry="8" fill="white" stroke="#222" stroke-width="2"/>
  <!-- Cejas enojadas -->
  <line x1="41" y1="57" x2="55" y2="61" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="61" x2="79" y2="57" stroke="#222" stroke-width="3" stroke-linecap="round"/>
  <!-- Pupilas -->
  <circle cx="50" cy="65" r="4" fill="#111"/>
  <circle cx="74" cy="65" r="4" fill="#111"/>
  <circle cx="52" cy="63" r="1.5" fill="white"/>
  <circle cx="76" cy="63" r="1.5" fill="white"/>
  <!-- Pico naranja -->
  <path d="M48,78 Q60,90 72,78 Q66,84 60,88 Q54,84 48,78Z" fill="#f4890a" stroke="#222" stroke-width="1.5"/>
  <!-- Lengua dentro del pico -->
  <ellipse cx="60" cy="84" rx="6" ry="3" fill="#e07070"/>
  <!-- Sombrero negro (estilo clásico) -->
  <rect x="38" y="54" width="44" height="8" rx="4" fill="#111" stroke="#222" stroke-width="1.5"/>
  <rect x="46" y="34" width="28" height="22" rx="4" fill="#111" stroke="#222" stroke-width="1.5"/>
  <!-- Cinta del sombrero -->
  <rect x="46" y="52" width="28" height="4" rx="2" fill="#e63946"/>
  <!-- Brazos/alas -->
  <path d="M32,108 Q18,100 22,118 Q26,130 36,128" fill="#1a1a2e" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <path d="M88,108 Q102,100 98,118 Q94,130 84,128" fill="#1a1a2e" stroke="#222" stroke-width="2" stroke-linejoin="round"/>
  <!-- Patas naranjas -->
  <path d="M46,148 L40,158 L46,156 L48,162 L52,156 L56,160 L56,148Z" fill="#f4890a" stroke="#222" stroke-width="1.5"/>
  <path d="M74,148 L68,158 L74,156 L76,162 L80,156 L84,160 L84,148Z" fill="#f4890a" stroke="#222" stroke-width="1.5"/>
</svg>
