<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" width="120" height="160">
  <!-- Conejo pícaro estilo cartoon (inspirado, no copiado) -->
  <!-- Orejas -->
  <ellipse cx="42" cy="38" rx="10" ry="28" fill="#e8cfa8" stroke="#222" stroke-width="2.5"/>
  <ellipse cx="42" cy="38" rx="5" ry="20" fill="#f4a0a0"/>
  <ellipse cx="78" cy="32" rx="10" ry="28" fill="#e8cfa8" stroke="#222" stroke-width="2.5"/>
  <ellipse cx="78" cy="32" rx="5" ry="20" fill="#f4a0a0"/>
  <!-- Cabeza -->
  <ellipse cx="60" cy="78" rx="32" ry="28" fill="#e8cfa8" stroke="#222" stroke-width="2.5"/>
  <!-- Mejillas rosadas -->
  <ellipse cx="42" cy="88" rx="9" ry="6" fill="#f4b8b8" opacity="0.6"/>
  <ellipse cx="78" cy="88" rx="9" ry="6" fill="#f4b8b8" opacity="0.6"/>
  <!-- Ojos -->
  <ellipse cx="50" cy="72" rx="7" ry="8" fill="white" stroke="#222" stroke-width="2"/>
  <ellipse cx="70" cy="72" rx="7" ry="8" fill="white" stroke="#222" stroke-width="2"/>
  <circle cx="52" cy="74" r="4" fill="#111"/>
  <circle cx="72" cy="74" r="4" fill="#111"/>
  <circle cx="54" cy="72" r="1.5" fill="white"/>
  <circle cx="74" cy="72" r="1.5" fill="white"/>
  <!-- Nariz -->
  <ellipse cx="60" cy="84" rx="5" ry="3.5" fill="#e07070" stroke="#222" stroke-width="1.5"/>
  <!-- Bigotes -->
  <line x1="65" y1="83" x2="88" y2="78" stroke="#222" stroke-width="1.5"/>
  <line x1="65" y1="85" x2="88" y2="85" stroke="#222" stroke-width="1.5"/>
  <line x1="65" y1="87" x2="88" y2="92" stroke="#222" stroke-width="1.5"/>
  <line x1="55" y1="83" x2="32" y2="78" stroke="#222" stroke-width="1.5"/>
  <line x1="55" y1="85" x2="32" y2="85" stroke="#222" stroke-width="1.5"/>
  <line x1="55" y1="87" x2="32" y2="92" stroke="#222" stroke-width="1.5"/>
  <!-- Sonrisa pícara -->
  <path d="M50,92 Q60,100 70,92" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <!-- Dientes -->
  <rect x="55" y="92" width="5" height="6" rx="1" fill="white" stroke="#222" stroke-width="1"/>
  <rect x="61" y="92" width="5" height="6" rx="1" fill="white" stroke="#222" stroke-width="1"/>
  <!-- Cuerpo -->
  <ellipse cx="60" cy="130" rx="24" ry="22" fill="#e8cfa8" stroke="#222" stroke-width="2.5"/>
  <!-- Corbata/lazo -->
  <polygon points="60,105 54,115 60,112 66,115" fill="#e63946" stroke="#222" stroke-width="1.5"/>
  <!-- Brazos -->
  <ellipse cx="30" cy="122" rx="9" ry="14" fill="#e8cfa8" stroke="#222" stroke-width="2" transform="rotate(-20,30,122)"/>
  <ellipse cx="90" cy="122" rx="9" ry="14" fill="#e8cfa8" stroke="#222" stroke-width="2" transform="rotate(20,90,122)"/>
  <!-- Mano con zanahoria -->
  <circle cx="92" cy="110" r="6" fill="#e8cfa8" stroke="#222" stroke-width="2"/>
  <rect x="89" y="100" width="6" height="14" rx="3" fill="#f4890a" stroke="#222" stroke-width="1.5"/>
  <path d="M90,100 Q92,94 94,100" fill="#4caf50" stroke="#222" stroke-width="1.5"/>
  <!-- Pies -->
  <ellipse cx="46" cy="150" rx="14" ry="7" fill="#e8cfa8" stroke="#222" stroke-width="2"/>
  <ellipse cx="74" cy="150" rx="14" ry="7" fill="#e8cfa8" stroke="#222" stroke-width="2"/>
</svg>
