<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 150" width="130" height="150">
  <!-- Cerdito regordete estilo cartoon (original) -->
  <!-- Sombra -->
  <ellipse cx="65" cy="144" rx="40" ry="6" fill="#000" opacity="0.18"/>
  <!-- Cuerpo gordo -->
  <ellipse cx="65" cy="110" rx="38" ry="34" fill="#f4a0b8" stroke="#222" stroke-width="2.5"/>
  <!-- Panza -->
  <ellipse cx="65" cy="116" rx="24" ry="22" fill="#ffd0e0"/>
  <!-- Cuello corto -->
  <rect x="52" y="80" width="26" height="16" rx="8" fill="#f4a0b8" stroke="#222" stroke-width="2"/>
  <!-- Cabeza redonda -->
  <ellipse cx="65" cy="66" rx="34" ry="30" fill="#f4a0b8" stroke="#222" stroke-width="2.5"/>
  <!-- Cachetes redondos y sonrosados -->
  <ellipse cx="44" cy="76" rx="11" ry="8" fill="#e87090" opacity="0.5"/>
  <ellipse cx="86" cy="76" rx="11" ry="8" fill="#e87090" opacity="0.5"/>
  <!-- Ojos pequeños y amigables -->
  <ellipse cx="52" cy="60" rx="9" ry="9" fill="white" stroke="#222" stroke-width="2"/>
  <ellipse cx="78" cy="60" rx="9" ry="9" fill="white" stroke="#222" stroke-width="2"/>
  <circle cx="54" cy="62" r="5" fill="#111"/>
  <circle cx="80" cy="62" r="5" fill="#111"/>
  <circle cx="56" cy="60" r="1.8" fill="white"/>
  <circle cx="82" cy="60" r="1.8" fill="white"/>
  <!-- Nariz grande circular -->
  <ellipse cx="65" cy="74" rx="12" ry="9" fill="#e87090" stroke="#222" stroke-width="1.5"/>
  <!-- Fosas nasales -->
  <ellipse cx="60" cy="75" rx="3" ry="3.5" fill="#c0506a"/>
  <ellipse cx="70" cy="75" rx="3" ry="3.5" fill="#c0506a"/>
  <!-- Boca sonriente -->
  <path d="M52,84 Q65,94 78,84" fill="none" stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Orejas -->
  <path d="M36,46 Q28,30 42,28 Q52,32 50,48Z" fill="#f4a0b8" stroke="#222" stroke-width="2"/>
  <path d="M94,46 Q102,30 88,28 Q78,32 80,48Z" fill="#f4a0b8" stroke="#222" stroke-width="2"/>
  <!-- Interior orejas -->
  <path d="M38,46 Q32,34 42,32 Q50,35 48,46Z" fill="#e87090"/>
  <path d="M92,46 Q98,34 88,32 Q80,35 82,46Z" fill="#e87090"/>
  <!-- Pajarita estilo cartoon -->
  <polygon points="65,87 56,92 65,89 74,92" fill="#e63946" stroke="#222" stroke-width="1.5"/>
  <circle cx="65" cy="89" r="3" fill="#c0392b" stroke="#222" stroke-width="1"/>
  <!-- Bracitos regordetes -->
  <ellipse cx="24" cy="106" rx="10" ry="16" fill="#f4a0b8" stroke="#222" stroke-width="2" transform="rotate(-15,24,106)"/>
  <ellipse cx="106" cy="106" rx="10" ry="16" fill="#f4a0b8" stroke="#222" stroke-width="2" transform="rotate(15,106,106)"/>
  <!-- Manitos -->
  <circle cx="18" cy="118" r="9" fill="#f4a0b8" stroke="#222" stroke-width="2"/>
  <circle cx="112" cy="118" r="9" fill="#f4a0b8" stroke="#222" stroke-width="2"/>
  <!-- Deditos -->
  <circle cx="13" cy="112" r="5" fill="#f4a0b8" stroke="#222" stroke-width="1.5"/>
  <circle cx="10" cy="120" r="5" fill="#f4a0b8" stroke="#222" stroke-width="1.5"/>
  <circle cx="117" cy="112" r="5" fill="#f4a0b8" stroke="#222" stroke-width="1.5"/>
  <circle cx="120" cy="120" r="5" fill="#f4a0b8" stroke="#222" stroke-width="1.5"/>
  <!-- Pies gorditoz -->
  <ellipse cx="48" cy="142" rx="18" ry="8" fill="#f4a0b8" stroke="#222" stroke-width="2"/>
  <ellipse cx="82" cy="142" rx="18" ry="8" fill="#f4a0b8" stroke="#222" stroke-width="2"/>
</svg>
